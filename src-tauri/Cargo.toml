[package]
name = "hyperfocus-app"
version = "1.0.0"
description = "Hyperfocus Timer & Hierarchical To-Do List"
authors = ["Hyperfocus Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hyperfocus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hyperfocus-app"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
